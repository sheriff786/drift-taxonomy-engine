# Base configuration (shared across environments)
project:
  name: drift-taxonomy-engine
  version: 1.0.0

data:
  raw_file: creditcard.csv
  target_column: Class

model:
  test_size: 0.2
  random_state: 42
  smote_strategy: 0.5
  primary_metric: auprc
  candidates:
    - random_forest
    - xgboost
    - lightgbm
    - logistic_regression

drift:
  ks_significance: 0.001
  cohens_d_threshold: 0.5
  missing_rate_threshold: 0.05
  performance_decay_threshold: 0.1
  severity:
    low: 0.2
    medium: 0.4
    high: 0.6
    critical: 0.8

monitoring:
  check_interval_minutes: 60
  alert_channels:
    - slack
    - email
